name: Build ELF

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc binutils xxd unzip

      - name: Download PS5 Payload SDK
        run: |
          wget https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          sudo unzip -d /opt ps5-payload-sdk.zip

      - name: Fix missing includes in kdlsym.c
        run: |
          sed -i 's|#include "offsets/13_00.h"|#include "offsets/12_00.h"\n#include "offsets/12_02.h"\n#include "offsets/12_20.h"\n#include "offsets/12_40.h"\n#include "offsets/12_60.h"\n#include "offsets/12_70.h"\n#include "offsets/13_00.h"\n#include "offsets/13_40.h"\n#include "offsets/13_42.h"|' kdlsym.c

      - name: Skip break_hv rebuild (use pre-built header)
        run: touch break_hv_payload/break_hv.h

      - name: Build ELF
        run: make
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: byepervisor_reborn
          path: byepervisor_reborn.elf
